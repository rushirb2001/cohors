[package]
name = "cohors-config"
description = "Configuration for cohors: the TOML config file, where it lives, and the COHORS_* environment overrides. Part of the cohors binary; install `cohors` to use it."
readme = "README.md"
# One shared keyword groups the cohors crates on crates.io without putting
# this internal crate in front of people searching for a git tool.
keywords = ["cohors"]
categories = ["config"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
serde = { workspace = true }
# prefs.json (the picker-chosen defaults) is JSON, not TOML.
serde_json = { workspace = true }
toml = { workspace = true }
# Comment-preserving edits (set/add roots, set keys) without flattening files.
toml_edit = { workspace = true }
directories = { workspace = true }
camino = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
