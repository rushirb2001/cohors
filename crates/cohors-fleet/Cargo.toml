[package]
name = "cohors-fleet"
description = "Fleet composition for cohors: config, git and GitHub wired into one Scanner and the read facade every front-end uses. Part of the cohors binary."
readme = "README.md"
# One shared keyword groups the cohors crates on crates.io without putting
# this internal crate in front of people searching for a git tool.
keywords = ["cohors"]
categories = ["development-tools"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
cohors-core = { workspace = true }
cohors-config = { workspace = true }
cohors-git = { workspace = true }
cohors-github = { workspace = true }
cohors-launchpad = { workspace = true }
camino = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
