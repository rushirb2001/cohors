[package]
name = "cohors-launchpad"
description = "Launchpad adapter for cohors: each repo's committed .cohors/ contribution, the cross-repo focus board and the agent activity log. Part of the cohors binary."
readme = "README.md"
# One shared keyword groups the cohors crates on crates.io without putting
# this internal crate in front of people searching for a git tool.
keywords = ["cohors"]
categories = ["development-tools"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
cohors-core = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
