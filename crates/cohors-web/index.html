<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cohors — your git fleet at a glance</title>
    <!-- Branded favicon: the cohors pixel-invader mark in brand violet. Trunk
         copies it into the dist bundle; the local server serves it. -->
    <link data-trunk rel="copy-file" href="favicon.svg" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="theme-color" content="#7a2e69" />
    <!-- Fonts (Google Fonts CDN): Google Sans for the UI, Google Sans Code for
         data, and Cormorant Garamond for the wordmark only. Fetched dynamically
         so distribution stays a single static bundle (no font files to ship);
         the family stacks in style.css fall back to system fonts if offline. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Google+Sans:wght@400;500;600;700&family=Google+Sans+Code:wght@400;500;600;700&display=swap"
    />
    <link data-trunk rel="css" href="style.css" />
  </head>
  <body></body>
</html>
