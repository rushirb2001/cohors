[package]
name = "cohors-github"
description = "GitHub reader for cohors: CI and pull-request status via the REST API. Part of the cohors binary; install `cohors` to use it."
readme = "README.md"
# One shared keyword groups the cohors crates on crates.io without putting
# this internal crate in front of people searching for a git tool.
keywords = ["cohors"]
categories = ["api-bindings"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
cohors-core = { workspace = true }
serde = { workspace = true }
ureq = { workspace = true }
tracing = { workspace = true }
rayon = { workspace = true }

[dev-dependencies]
# Fixture-JSON parse tests for the REST response structs.
serde_json = { workspace = true }
