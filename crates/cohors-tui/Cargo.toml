[package]
# Published as `cohors`, so every channel uses one name: `cargo install cohors`,
# `brew install …/cohors`, `pip install cohors`, `npm install -g cohors`. The
# folder keeps its old name, crates/cohors-tui.
name = "cohors"
description = "Every git repo you own, on one screen: a terminal dashboard, CLI and MCP server for your whole fleet of repositories."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["git", "tui", "dashboard", "mcp", "cli"]
categories = ["command-line-utilities", "development-tools"]
# What goes into the crates.io package. `dist/` is the browser dashboard, built
# by the publish workflow just before publishing (it is gitignored, which is why
# it has to be listed): build.rs compiles it into the binary, so `cohors web`
# works after `cargo install cohors` with no Trunk and no checkout.
include = ["src/**/*.rs", "build.rs", "dist/**/*"]
# Declaring the bin explicitly and disabling auto-discovery avoids a duplicate
# target from the same `src/main.rs`.
autobins = false

[[bin]]
name = "cohors"
path = "src/main.rs"

[dependencies]
cohors-core = { workspace = true }
cohors-config = { workspace = true }
cohors-actions = { workspace = true }
cohors-fleet = { workspace = true }
cohors-mcp = { workspace = true }
cohors-web = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
camino = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ratatui = { workspace = true }
arboard = { workspace = true }
# `cohors web`: a local server that serves the WASM dashboard and the local scan
# as JSON (remote enrichment runs server-side via cohors-github).
tiny_http = { workspace = true }
# Looking up cohors' own latest release, and fetching its installer, to keep
# cohors up to date (src/update.rs). The same client the GitHub adapter uses.
ureq = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
tempfile = { workspace = true }
serde_json = { workspace = true }
insta = { workspace = true }

# Ship this crate's `cohors` binary as the prebuilt release artifact (archives
# `cohors-<target>.tar.xz`, the `cohors-installer.sh` script, the `cohors`
# Homebrew formula and npm package).
[package.metadata.dist]
dist = true
formula = "cohors"
