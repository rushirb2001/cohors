[package]
# Published as `cohors`, so every channel uses one name: `cargo install cohors`,
# `brew install …/cohors`, `pip install cohors`, `npm install -g @cohors/cli`
# (npm refuses the bare name). The folder keeps its old name, crates/cohors-tui.
name = "cohors"
# cargo-dist reuses this line as the Homebrew formula's `desc` and the npm
# package's description, so it keeps to Homebrew's rules: under 80 characters,
# no leading article, no full stop.
description = "Every git repo you own on one screen: terminal dashboard, CLI and MCP server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
# Written for crates.io (`cargo install`); the npm package and the release
# archives carry packaging/npm/README.md instead (see the dist config).
readme = "README.md"
# crates.io allows five. The categories already say "command-line utility".
keywords = ["git", "multi-repo", "tui", "dashboard", "mcp"]
categories = ["command-line-utilities", "development-tools"]
# What goes into the crates.io package. `dist/` is the browser dashboard, built
# by the publish workflow just before publishing (it is gitignored, which is why
# it has to be listed): build.rs compiles it into the binary, so `cohors web`
# works after `cargo install cohors` with no Trunk and no checkout.
include = ["src/**/*.rs", "build.rs", "dist/**/*", "README.md"]
# Declaring the bin explicitly and disabling auto-discovery avoids a duplicate
# target from the same `src/main.rs`.
autobins = false

[[bin]]
name = "cohors"
path = "src/main.rs"

[dependencies]
cohors-core = { workspace = true }
cohors-config = { workspace = true }
cohors-actions = { workspace = true }
cohors-fleet = { workspace = true }
cohors-mcp = { workspace = true }
cohors-web = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
camino = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ratatui = { workspace = true }
arboard = { workspace = true }
# `cohors web`: a local server that serves the WASM dashboard and the local scan
# as JSON (remote enrichment runs server-side via cohors-github).
tiny_http = { workspace = true }
# Looking up cohors' own latest release, and fetching its installer, to keep
# cohors up to date (src/update.rs). The same client the GitHub adapter uses.
ureq = { workspace = true }


# Forwards Ctrl-C to `cohors run`'s jobs, which run in their own process
# groups (so a timeout can stop everything they start). Already in the tree
# through crossterm; only the safe `flag` API is used.
[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[dev-dependencies]
assert_cmd = { workspace = true }
tempfile = { workspace = true }
serde_json = { workspace = true }
insta = { workspace = true }

# Ship this crate's `cohors` binary as the prebuilt release artifact (archives
# `cohors-<target>.tar.xz`, the `cohors-installer.sh` script, the `cohors`
# Homebrew formula and npm package).
[package.metadata.dist]
dist = true
formula = "cohors"
