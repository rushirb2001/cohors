[package]
name = "cohors-mcp"
description = "MCP server of cohors: fleet reads and gated git actions for a coding agent, over JSON-RPC on stdio. Part of the cohors binary; run it with `cohors mcp`."
readme = "README.md"
# One shared keyword groups the cohors crates on crates.io without putting
# this internal crate in front of people searching for a git tool.
keywords = ["cohors"]
categories = ["development-tools"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
cohors-core = { workspace = true }
cohors-fleet = { workspace = true }
cohors-actions = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
rayon = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
