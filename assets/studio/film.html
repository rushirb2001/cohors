<!doctype html>
<!--
  The launch film: forty-eight seconds, 1920 by 1080.

  Every screen in it is a real capture of cohors on the made-up fleet (run
  scripts/studio/capture.sh first). The film adds only a camera, captions and
  the key that was pressed.

  Render:   scripts/studio/render.mjs --page assets/studio/film.html --size 1920x1080 --frames target/assets/frames/film
  Preview:  open this page with ?t=12000 for one instant, or ?play=1 to watch.
  The sting: ?sting=1 is the opening alone (the mark assembling, the name,
            the line), held at the end: a four-second ident.

  The shape, in milliseconds:
       0  the mark assembles, the name is typed
    3200  the whole dashboard
    9000  Do next: one key pushes what exists only on this machine
   16000  Work at risk
   21500  the standup
   27000  the launchpad
   32500  the same fleet in the terminal, the editor and the browser
   37500  the coding agent reading it
   43500  where to get it
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>cohors: the film</title>
<link rel="stylesheet" href="stage.css">
<style>
  .intro, .outro { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; text-align: center; }
  .intro .mark { width: min(420px, 44vw); height: min(280px, 29.3vw); overflow: visible; }
  .intro h1 { margin-top: 44px; font-size: min(128px, 13vw); font-weight: 800; letter-spacing: -0.06em; line-height: 1; color: var(--purple); }
  .intro p { margin-top: 26px; font-size: min(34px, 3.6vw); color: var(--ink-2); letter-spacing: -0.02em; }
  .outro .mark { width: 180px; height: 120px; }
  .outro h1 { margin-top: 26px; font-size: 92px; font-weight: 800; letter-spacing: -0.06em; line-height: 1; color: var(--purple); }
  .outro p { margin-top: 18px; font-size: 30px; color: var(--ink-2); letter-spacing: -0.02em; }
  .install { display: grid; gap: 14px; margin-top: 54px; text-align: left; }
  .install code { display: block; padding: 18px 28px; border-radius: 12px; background: var(--panel); box-shadow: 0 0 0 1px var(--line); font: 500 min(30px, 3.1vw) var(--mono); color: var(--ink); }
  .install code i { font-style: normal; color: var(--ink-3); }
  .outro small { margin-top: 40px; font-size: 26px; color: var(--ink-3); }

  /* The name over each of the three places the fleet is shown. */
  .place { position: absolute; font-size: 72px; font-weight: 700; letter-spacing: -0.04em; color: var(--ink-2); white-space: nowrap; }

  /* The agent: a question, the tool it calls, and what cohors answers. The
     pane is laid out 1180 wide and scaled to the frame. */
  #agent { left: 0; top: 0; width: 1180px; transform-origin: 0 0; }
  .talk { padding: 30px 36px 34px; font-size: 24px; line-height: 1.4; letter-spacing: -0.01em; }
  .talk .ask { color: var(--ink); font-weight: 500; }
  .talk .ask b { color: var(--purple); margin-right: 14px; }
  .talk .ask u { display: inline-block; width: 13px; height: 27px; margin-left: 3px; vertical-align: -5px; background: var(--ink-2); text-decoration: none; }
  .talk .call { display: flex; align-items: center; gap: 14px; margin-top: 22px; color: var(--ink-2); }
  .talk .call em { font-style: normal; color: var(--purple); }
  .talk .call small { padding: 2px 10px; border-radius: 6px; box-shadow: inset 0 0 0 1px #4a4641; font-size: 17px; color: var(--ink-3); }
  .talk .call span { color: var(--ink-3); }
  .talk .said { margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--line); color: var(--ink); font-weight: 500; }
  .talk .step { display: grid; grid-template-columns: 78px 1fr; column-gap: 20px; margin-top: 16px; }
  .talk .step i { align-self: start; margin-top: 4px; padding: 2px 0; border-radius: 5px; text-align: center; font-style: normal; font-size: 17px; font-weight: 700; color: var(--ground); }
  .talk .step i.risk { background: var(--brick); }
  .talk .step i.warn { background: var(--ochre); }
  .talk .step i.notice, .talk .step i.info { box-shadow: inset 0 0 0 1px #4a4641; color: var(--ink-2); }
  .talk .step b { display: block; font-weight: 700; color: var(--ink); }
  .talk .step p { font-size: 20px; color: var(--ink-2); }
</style>
</head>
<body>
<div id="stage">
  <div id="world"></div>
  <div class="win" id="agent">
    <div class="winbar"><i></i><i></i><i></i><span>your coding agent</span></div>
    <div class="talk">
      <p class="ask"><b>&rsaquo;</b><span id="ask"></span><u id="caret"></u></p>
      <p class="call" id="call"><em>cohors</em>overview<small>MCP tool</small><span id="calling"></span></p>
      <p class="said" id="said"></p>
      <div id="steps"></div>
    </div>
  </div>
  <div class="scrim" id="scrim"></div>
  <div class="caption" id="caption"><h2></h2><p></p></div>
  <div class="keycap" id="keycap"><b></b><span></span></div>
  <div class="intro" id="intro"><div id="intro-mark"></div><h1 id="intro-name"></h1><p id="intro-line">Every repo you own. One screen.</p></div>
  <div class="outro" id="outro">
    <div id="outro-mark"></div>
    <h1>cohors</h1>
    <p>Free and open source. One Rust binary.</p>
    <div class="install"><code><i>$ </i>brew install rushirb2001/tap/cohors</code><code><i>$ </i>pip install cohors</code><code><i>$ </i>npm install -g @cohors/cli</code><code><i>$ </i>cargo install cohors</code></div>
    <small>github.com/rushirb2001/cohors</small>
  </div>
</div>
<script src="stage.js"></script>
<script>
(() => {
  const S = Stage;
  // The film takes the size it is rendered at: 1920x1080 for the main cut,
  // 1080x1080 and 1080x1920 for feeds that are square or upright. The camera
  // frames each shot to fit, so nothing is cropped away.
  const W = innerWidth, H = innerHeight;
  const upright = H > W * 1.2;
  const $ = (id) => document.getElementById(id);

  // What the film says, and when. One plain sentence about what is on
  // screen, and one line of detail under it.
  const CAPTIONS = [
    [4000, 8700, "Every repository you own, on one screen.", "Thirteen repos: what changed, what is unpushed, what is waiting."],
    [9600, 13300, "It tells you what to do next.", "One key pushes everything that exists only on this machine."],
    [13700, 15700, "Four repositories backed up with one key.", "Not backed up: five before, one after."],
    [16600, 21100, "Work at risk is marked before it is lost.", "Unpushed commits, old stashes, branches that were never published."],
    [22100, 26600, "A standup from every repo, in one key.", "Everything you committed this week, grouped by repository."],
    [27600, 32100, "Each repo says what is waiting in it.", "Tasks and flows live in the repo, so they travel with the clone."],
    [33500, 37100, "The same fleet in three places.", "Your terminal, your editor and your browser, all from one binary."],
    [38300, 43100, "Your coding agent reads the same fleet.", "The same binary is an MCP server. Reads are open; writes stay off until you allow them."],
  ];
  // The key pressed, and what it did.
  const KEYS = [
    [11600, 13900, "P", "push"],
    [21700, 23600, "s", "standup"],
    [27200, 29100, "t", "tasks"],
    [32150, 33300, "esc", "back"],
  ];
  // Which capture is showing. Each change is a short cross-fade, timed to the
  // key that caused it.
  const SCREENS = [
    [0, "before-push"], [12300, "after-push"], [16000, "risk"], [21900, "standup"], [27400, "launchpad"], [32300, "after-push"],
  ];
  const ORDER = ["before-push", "after-push", "risk", "standup", "launchpad"];
  const FADE = 260;
  // When the later scenes happen.
  const PLACES = 32500, AGENT = 37500, CLOSE = 43500;
  // What the agent is asked. Everything it is shown answering is cohors's own
  // output for the made-up fleet (captures/overview.json).
  const ASKED = "What needs my attention across my repos?";
  const TAGS = { risk: "RISK", warn: "WARN", notice: "NOTE", info: "INFO" };
  // The sting is the opening alone, held once it has assembled.
  const STING = new URLSearchParams(location.search).has("sting");

  let win, cam, shots, ring, introMark, outroMark, places, agentAt;

  window.duration = STING ? 4600 : 48000;
  window.ready = (async () => {
    await S.fonts();
    win = await S.terminal(["before-push", "after-push", "risk", "standup", "launchpad"], "cohors  ~/code");
    $("world").appendChild(win);
    cam = S.camera($("world"), W, H);

    // The shots, measured once while nothing is transformed.
    const whole = { x: 0, y: 0, w: win.offsetWidth, h: win.offsetHeight };
    const next = S.find(win, "before-push", "Do next", { rows: 8, pad: 14 });
    const pushRow = S.find(win, "before-push", "Push 4 commits", { rows: 1, pad: 3 });
    const standup = S.find(win, "standup", "Standup", { rows: 21, pad: 10 });
    const launchpad = S.find(win, "launchpad", "Launchpad", { rows: 30, pad: 10 });
    // The row the key acts on gets a ring, in the window's own coordinates.
    ring = document.createElement("div");
    ring.className = "ring";
    Object.assign(ring.style, { left: `${pushRow.x + 14}px`, top: `${pushRow.y}px`, width: `${pushRow.w * 0.62}px`, height: `${pushRow.h}px` });
    win.appendChild(ring);
    const tiles = S.find(win, "after-push", "Not backed up", { rows: 3, pad: 34 });
    const risk = S.find(win, "risk", "Work at risk", { rows: 8, pad: 14 });
    // An upright frame is narrower than the window. Rather than shrink the
    // whole window to fit (and its text with it), each shot there takes the
    // left part of what it is about, at a size that can be read on a phone.
    const part = (rect, share) => (upright ? { ...rect, w: rect.w * share } : rect);
    shots = {
      wide: cam.frame(part(whole, 0.6), 0.94),
      // Start a little further back, so the film opens on a slow push in.
      far: { ...cam.frame(part(whole, 0.6), 0.94), zoom: cam.frame(part(whole, 0.6), 0.94).zoom * 0.9 },
      // The left two thirds of the card: the steps, and the start of why.
      next: cam.frame({ ...next, w: next.w * (upright ? 0.46 : 0.66) }, 0.94),
      // The first three figure tiles, where the number changes.
      tiles: cam.frame({ ...tiles, w: tiles.w * (upright ? 0.34 : 0.52) }, 0.78),
      risk: cam.frame(part(risk, 0.52), 0.96),
      // The overlays are centred on the window; sit a little lower so the
      // caption does not cover their first rows.
      // An overlay sits in the middle of the window, about three quarters
      // of its width.
      standup: cam.frame({ ...standup, x: whole.w * 0.12, w: whole.w * (upright ? 0.5 : 0.76) }, 0.9),
      launchpad: cam.frame({ ...launchpad, x: whole.w * 0.12, w: whole.w * (upright ? 0.5 : 0.76) }, 0.9),
    };
    // A caption covers the bottom of the frame, so a shot of something low
    // on the window is nudged up to keep it clear.
    const lift = H * (upright ? 0.08 : 0.1);
    for (const name of ["next", "risk", "standup", "launchpad", "tiles"]) shots[name].y += (name === "tiles" ? lift * 0.4 : lift) / shots[name].zoom;
    shots.wide.y += (lift * 0.55) / shots.wide.zoom;
    shots.far.y += (lift * 0.55) / shots.far.zoom;

    // ── the three places ──
    // The editor's and the browser's pictures (the extension's dashboard and
    // `cohors web`, both drawn from this same fleet) sit in the world beside
    // the terminal, unseen until the camera pulls back far enough to show
    // them. A wide frame has them in a row, an upright one in a column, a
    // square one with the terminal over the other two.
    const GAP = 110, LABEL = 116, BAR = 38;
    const layout = W > H * 1.2
      ? (() => { const w = Math.round((whole.h - BAR) * 1.6); return { editor: { x: whole.w + GAP, y: 0, w }, browser: { x: -(w + GAP), y: 0, w } }; })()
      : upright
        ? (() => { const h = whole.w / 1.6 + BAR; return { editor: { x: 0, y: whole.h + GAP + LABEL, w: whole.w }, browser: { x: 0, y: whole.h + h + (GAP + LABEL) * 2, w: whole.w } }; })()
        : (() => { const w = (whole.w - GAP) / 2; return { editor: { x: 0, y: whole.h + GAP + LABEL, w }, browser: { x: w + GAP, y: whole.h + GAP + LABEL, w } }; })();
    places = [];
    const all = { x: 0, y: -LABEL, w: whole.w, h: whole.h + LABEL };
    const place = (name, node, at, from) => {
      const label = document.createElement("div");
      label.className = "place";
      label.textContent = name;
      for (const piece of [node, label]) $("world").appendChild(piece);
      const height = node === win ? whole.h : at.w / 1.6 + BAR;
      // Grow the rectangle that holds all three.
      const right = Math.max(all.x + all.w, at.x + at.w), bottom = Math.max(all.y + all.h, at.y + height);
      all.x = Math.min(all.x, at.x); all.w = right - all.x; all.h = bottom - all.y;
      places.push({ node, label, at, from });
    };
    const editor = S.picture("/assets/vscode.png", "Visual Studio Code", layout.editor.w);
    const browser = S.picture("/assets/web.png", "cohors web", layout.browser.w);
    await Promise.all([editor.loaded, browser.loaded]);
    place("Terminal", win, { x: 0, y: 0, w: whole.w }, { x: 0, y: 0 });
    // Each arrives from the side it sits on.
    place("Editor", editor, layout.editor, { x: Math.sign(layout.editor.x) * 220, y: layout.editor.x ? 0 : 220 });
    place("Browser", browser, layout.browser, { x: Math.sign(layout.browser.x) * 220, y: layout.browser.x && layout.browser.y === 0 ? 0 : 220 });
    // All three, fitted into the part of the frame above the caption.
    const band = upright ? [0.04, 0.7] : W > H * 1.2 ? [0.06, 0.7] : [0.04, 0.6];
    const zoom = Math.min((W * 0.92) / all.w, (H * (band[1] - band[0])) / all.h);
    shots.all = { x: all.x + all.w / 2, y: all.y + all.h / 2 + (H / 2 - (H * (band[0] + band[1])) / 2) / zoom, zoom };
    shots.allNear = { ...shots.all, zoom: zoom * 1.05 };

    // ── the agent ──
    const fleet = await (await fetch("/target/assets/captures/overview.json")).json();
    $("said").textContent = fleet.headline;
    $("steps").innerHTML = fleet.actions.map((step) =>
      `<div class="step"><i class="${step.severity}">${TAGS[step.severity] || ""}</i><div><b>${step.title}</b><p>${step.why}</p></div></div>`).join("");
    const pane = $("agent");
    const fit = Math.min((W * 0.9) / pane.offsetWidth, (H * (upright ? 0.5 : 0.6)) / pane.offsetHeight);
    agentAt = { x: (W - pane.offsetWidth * fit) / 2, y: H * (upright ? 0.21 : 0.07), fit };

    introMark = S.mark(); $("intro-mark").appendChild(introMark);
    outroMark = S.mark(); $("outro-mark").appendChild(outroMark);
    const start = new URLSearchParams(location.search);
    if (start.has("play")) {
      const began = performance.now();
      const tick = () => { window.seek((performance.now() - began) % window.duration); requestAnimationFrame(tick); };
      tick();
    } else {
      window.seek(Number(start.get("t") || 0));
    }
  })();

  // The camera's path through the film.
  const path = () => S.track([
    [3200, shots.far],
    [8800, shots.wide],
    [10300, shots.next],
    [12600, shots.next],
    [13900, shots.tiles],
    [15400, shots.tiles],
    [16900, shots.risk],
    [20900, shots.risk],
    [22300, shots.standup],
    [26900, shots.standup],
    [28000, shots.launchpad],
    [32300, shots.launchpad],
    // Pull back until the editor and the browser are in the frame too, then
    // keep drifting in a little so the shot is never still.
    [34200, shots.all],
    [37600, shots.allNear, S.ease.linear],
  ]);

  // The colours a cell of the mark passes through as it falls into place:
  // the severity colours first, the mark's own purple once it has landed.
  const FALLING = ["#d9776e", "#cfa255", "#7fb08c", "#7e9cc2", "#5faea6"];

  function drawMark(svg, t, begin) {
    svg.cells.forEach((cell, i) => {
      // Columns arrive left to right, the lower rows first, like blocks
      // stacking up.
      const delay = begin + cell.x * 55 + (10 - cell.y) * 26;
      const k = S.span(t, delay, delay + 620, S.ease.out);
      const drop = (1 - k) * -16;
      cell.rect.setAttribute("transform", `translate(0 ${drop.toFixed(3)})`);
      cell.rect.style.opacity = S.clamp(k * 1.6) * cell.base;
      cell.rect.style.fill = k < 0.999 ? FALLING[i % FALLING.length] : "";
    });
  }

  window.seek = (t) => {
    // The sting stops the clock just before the opening would give way.
    if (STING) t = Math.min(t, 2890);
    // ── the opening ──
    const introShown = 1 - S.span(t, 2900, 3300, S.ease.in);
    $("intro").style.opacity = introShown;
    $("intro").style.visibility = introShown > 0.001 ? "visible" : "hidden";
    drawMark(introMark, t, 150);
    const name = "cohors";
    $("intro-name").textContent = name.slice(0, Math.round(S.span(t, 1500, 2050, S.ease.linear) * name.length)) || " ";
    $("intro-line").style.opacity = S.span(t, 2100, 2500, S.ease.out);

    // ── the dashboard ──
    const body = S.span(t, 3100, 3700, S.ease.out) * (1 - S.span(t, AGENT - 300, AGENT + 200, S.ease.in));
    $("world").style.opacity = body;
    $("world").style.visibility = body > 0.001 ? "visible" : "hidden";
    cam.set(path()(t));

    // Which capture shows. A screen that sits above the one before it fades
    // in over it; one that sits below (going back from an overlay to the
    // dashboard) is uncovered as the one above fades out.
    const visible = {};
    SCREENS.forEach(([at, screen], i) => {
      const before = i > 0 ? SCREENS[i - 1][1] : null;
      const after = i + 1 < SCREENS.length ? SCREENS[i + 1] : null;
      const over = (a, b) => ORDER.indexOf(a) > ORDER.indexOf(b);
      let amount;
      if (t < at) amount = 0;
      else if (before && over(screen, before)) amount = S.span(t, at, at + FADE, S.ease.out);
      else amount = 1;
      if (after && t >= after[0]) {
        // Stay under the next one until it has covered this, or fade away
        // to uncover it.
        amount = over(after[1], screen) ? (t < after[0] + FADE ? amount : 0) : 1 - S.span(t, after[0], after[0] + FADE, S.ease.out);
      }
      visible[screen] = Math.max(visible[screen] || 0, amount);
    });
    win.show(visible);

    // The ring round the row, just before and while the key goes down.
    ring.style.opacity = S.during(t, 10500, 12350, 260);

    // ── the three places ──
    const shown3 = S.during(t, PLACES, AGENT + 200, 700);
    const arrive = S.span(t, PLACES, PLACES + 1500, S.ease.out);
    for (const { node, label, at, from } of places) {
      const x = at.x + from.x * (1 - arrive), y = at.y + from.y * (1 - arrive);
      if (node !== win) {
        Object.assign(node.style, { left: `${x}px`, top: `${y}px`, opacity: shown3, visibility: shown3 > 0.001 ? "visible" : "hidden" });
      }
      Object.assign(label.style, { left: `${x}px`, top: `${y - 108}px`, opacity: shown3 * S.span(t, PLACES + 900, PLACES + 1500, S.ease.out) });
    }

    // ── the agent ──
    const agent = S.during(t, AGENT, CLOSE - 100, 450);
    const pane = $("agent");
    pane.style.opacity = agent;
    pane.style.visibility = agent > 0.001 ? "visible" : "hidden";
    pane.style.transform = `translate(${agentAt.x}px, ${agentAt.y + (1 - S.span(t, AGENT, AGENT + 600, S.ease.out)) * 26}px) scale(${agentAt.fit})`;
    // The question is typed, the tool is called, the answer arrives a row at
    // a time.
    const typed = Math.round(S.span(t, AGENT + 600, AGENT + 1900, S.ease.linear) * ASKED.length);
    $("ask").textContent = ASKED.slice(0, typed);
    $("caret").style.opacity = typed < ASKED.length ? 1 : 0;
    const called = AGENT + 2200, answered = AGENT + 2950;
    $("call").style.opacity = S.span(t, called, called + 200, S.ease.out);
    $("calling").textContent = t < answered ? ".".repeat(1 + (Math.floor(Math.max(0, t - called) / 180) % 3)) : "";
    $("said").style.opacity = S.span(t, answered, answered + 260, S.ease.out);
    [...$("steps").children].forEach((step, i) => {
      const k = S.span(t, answered + 250 + i * 240, answered + 600 + i * 240, S.ease.out);
      step.style.opacity = k;
      step.style.transform = `translateY(${(1 - k) * 10}px)`;
    });

    // ── words ──
    let words = null, shown = 0;
    for (const [on, off, head, sub] of CAPTIONS) {
      const amount = S.during(t, on, off, 420);
      if (amount > shown) { shown = amount; words = [head, sub]; }
    }
    const caption = $("caption");
    caption.style.opacity = shown;
    caption.style.transform = `translateY(${(1 - shown) * 18}px)`;
    if (words) {
      caption.querySelector("h2").textContent = words[0];
      caption.querySelector("p").textContent = words[1];
    }
    $("scrim").style.opacity = Math.max(shown, 0) * Math.max(body, agent);

    let key = null, pressed = 0;
    for (const [on, off, cap, does] of KEYS) {
      const amount = S.during(t, on, off, 220);
      if (amount > pressed) { pressed = amount; key = [cap, does, on]; }
    }
    const keycap = $("keycap");
    keycap.style.opacity = pressed;
    if (key) {
      keycap.querySelector("b").textContent = key[0];
      keycap.querySelector("span").textContent = key[1];
      // The cap goes down as it is pressed and comes back up.
      const down = S.span(t, key[2], key[2] + 110, S.ease.out) * (1 - S.span(t, key[2] + 150, key[2] + 420, S.ease.out));
      keycap.querySelector("b").style.transform = `translateY(${down * 5}px)`;
      keycap.querySelector("b").style.boxShadow = `0 0 0 1px #3a3734, 0 ${5 - down * 5}px 0 #0c0b0b`;
    }

    // ── the close ──
    const end = S.span(t, CLOSE, CLOSE + 700, S.ease.out);
    $("outro").style.opacity = end;
    $("outro").style.visibility = end > 0.001 ? "visible" : "hidden";
    drawMark(outroMark, t, CLOSE);
  };
})();
</script>
</body>
</html>
