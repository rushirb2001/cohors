<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="t d"><title id="t">Updating cohors by hand</title><desc id="d">Homebrew: brew update &amp;&amp; brew upgrade cohors; pip: pip install -U cohors; npm: npm install -g @cohors/cli@latest; Cargo: cargo install cohors; Shell installer: run the install line again; uvx or npx with @latest: nothing to do, each run is the newest</desc><style>.f-panel{fill:#1A1219}.s-panel{stroke:#1A1219}.f-band{fill:#2A1A27}.s-band{stroke:#2A1A27}.f-bar{fill:#B55CA4}.s-bar{stroke:#B55CA4}.f-on-bar{fill:#FFFFFF}.s-on-bar{stroke:#FFFFFF}.f-accent{fill:#D9A6CF}.s-accent{stroke:#D9A6CF}.f-ink{fill:#F2E9F0}.s-ink{stroke:#F2E9F0}.f-sub{fill:#A99AA6}.s-sub{stroke:#A99AA6}.f-off{fill:#5A4A57}.s-off{stroke:#5A4A57}.f-cap{fill:#2A1A27}.s-cap{stroke:#2A1A27}.f-cap-edge{fill:#5A4A57}.s-cap-edge{stroke:#5A4A57}.f-term{fill:#120C11}.s-term{stroke:#120C11}.f-term-bar{fill:#221520}.s-term-bar{stroke:#221520}.f-term-ink{fill:#F2E9F0}.s-term-ink{stroke:#F2E9F0}.f-term-sub{fill:#A99AA6}.s-term-sub{stroke:#A99AA6}.f-term-prompt{fill:#D9A6CF}.s-term-prompt{stroke:#D9A6CF}.f-lavender{fill:#C98AC0}.s-lavender{stroke:#C98AC0}.f-orchid{fill:#B55CA4}.s-orchid{stroke:#B55CA4}.f-do-next{fill:#B55CA4}.f-risk{fill:#D9776E}.f-tasks{fill:#7FB08C}.f-commits{fill:#7E9CC2}.f-repos{fill:#5FAEA6}</style><path d="M6 0h988v6h6v308h-6v6h-988v-6h-6v-308h6z" class="f-term"/><path d="M6 0h988v6h6v26h-6v6h-988v-6h-6v-26h6z" class="f-term-bar"/><rect x="20" y="14.0" width="10" height="10" class="f-orchid"/><rect x="36" y="14.0" width="10" height="10" class="f-lavender"/><rect x="52" y="14.0" width="10" height="10" class="f-band"/><text x="500.0" y="24.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" class="f-term-sub" text-anchor="middle">updating cohors by hand</text><text x="24" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-s