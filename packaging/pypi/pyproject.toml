[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

# A thin wrapper package so `pip install cohors` drops the prebuilt `cohors`
# binary on your PATH. CI builds one platform-specific wheel per target, each
# bundling the matching binary from that version's GitHub Release; nothing is
# downloaded at install or run time. The `version` is overwritten from the
# release tag by the publish workflow.
[project]
name = "cohors"
version = "0.0.0"
description = "Every git repo you own on one screen: a terminal dashboard, a scriptable CLI and an MCP server for your coding agent. Prebuilt, no Rust needed."
# README.md's "What's new" block is filled in from CHANGELOG.md by the publish
# workflow (scripts/release-notes.py stamp), so pypi.org always describes the
# release it serves.
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Rushir Bhavsar" }]
keywords = ["git", "multi-repo", "repositories", "dashboard", "tui", "cli", "mcp", "mcp-server", "claude-code", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/rushirb2001/cohors"
Documentation = "https://github.com/rushirb2001/cohors#readme"
Repository = "https://github.com/rushirb2001/cohors"
Changelog = "https://github.com/rushirb2001/cohors/blob/main/CHANGELOG.md"
"Release notes" = "https://github.com/rushirb2001/cohors/releases"
Issues = "https://github.com/rushirb2001/cohors/issues"

# The `cohors` command is a tiny Python shim that execs the bundled binary.
[project.scripts]
cohors = "cohors.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

# Bundle the native binary (dropped into the package dir by CI) into the wheel.
[tool.setuptools.package-data]
cohors = ["cohors", "cohors.exe"]
