[workspace]
resolver = "2"
members = [
    "crates/cohors-core",
    "crates/cohors-config",
    "crates/cohors-git",
    "crates/cohors-github",
    "crates/cohors-actions",
    "crates/cohors-launchpad",
    "crates/cohors-fleet",
    "crates/cohors-mcp",
    "crates/cohors-web",
    "crates/cohors-tui",
]
# cohors-web is split by build target: its native server half (lib) is a normal
# member built/tested by the host gates, while its Leptos browser half builds only
# for `wasm32-unknown-unknown` (served with Trunk) via `[target.…]` deps that the
# host never pulls. See crates/cohors-web/Cargo.toml.

# Shared package metadata. Each crate inherits these with `field.workspace = true`
# so version/edition/license stay consistent across the workspace.
[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
authors = ["Rushir Bhavsar <rbhavsa4@asu.edu>"]
repository = "https://github.com/rushirb2001/cohors"
homepage = "https://github.com/rushirb2001/cohors"

# Shared dependencies: pinned once here, consumed in a crate with
# `<dep> = { workspace = true }`. This keeps every crate on the same version.
[workspace.dependencies]
# Models, serialization, cache, errors, logging — used across several crates.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
camino = { version = "1", features = ["serde1"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Fuzzy matching for the filter UI (ADR-005). Note: the low-level *matcher* only
# — the high-level `nucleo` crate spawns worker threads, which would break the
# WASM-safe core.
nucleo-matcher = "0.3"

# Config parsing + cross-platform base directories (cohors-config).
toml = "0.8"
# Comment-preserving config edits (`cohors config set`, appending detected roots).
toml_edit = "0.22"
directories = "5"

# Local git adapter (cohors-git).
# gix is the primary, pure-Rust git implementation (ADR-004). Default features
# stay on — they pull no network client or C zlib backend — and already include
# `basic`/`revision` (merge-base, for ahead/behind). We add `status` for the
# worktree status (staged/modified/untracked).
gix = { version = "0.84", features = ["status"] }
# git2 (libgit2) is the feature-gated fallback for gaps gix doesn't cover yet.
git2 = { version = "0.21", default-features = false }
ignore = "0.4"
globset = "0.4"
glob = "0.3"
rayon = "1"

# TUI / CLI front-end (cohors-tui).
clap = { version = "4", features = ["derive"] }
# ratatui re-exports crossterm, so the TUI uses `ratatui::crossterm` rather than
# a separate crossterm dep — that keeps the two versions in lockstep.
ratatui = "0.30"
# Clipboard for the "copy path" action.
arboard = "3"
# Detect the terminal's background (OSC 11) so the cards adapt to dark/light.
termbg = "0.5"

# Remote adapter (cohors-github): blocking HTTP client with rustls TLS + JSON.
ureq = { version = "2", features = ["json"] }

# Tiny blocking HTTP server for `cohors web`: serves the built WASM assets and
# proxies GitHub (injecting the local token) so the browser never sees it.
tiny_http = "0.12"

# Dev/test helpers.
tempfile = "3"
assert_cmd = "2"
insta = "1"

# Internal crates referenced by path. Front-ends depend on these, never on the
# concrete data source directly (everything funnels through cohors-core).
cohors-core = { path = "crates/cohors-core" }
cohors-config = { path = "crates/cohors-config" }
cohors-git = { path = "crates/cohors-git" }
cohors-github = { path = "crates/cohors-github" }
cohors-actions = { path = "crates/cohors-actions" }
cohors-launchpad = { path = "crates/cohors-launchpad" }
cohors-fleet = { path = "crates/cohors-fleet" }
cohors-mcp = { path = "crates/cohors-mcp" }
cohors-web = { path = "crates/cohors-web" }

# Release config for cargo-dist (the `dist` tool). After changing anything here,
# run `cargo dist generate` to regenerate `.github/workflows/release.yml`; its
# own CI check fails the release if the two drift apart.
[workspace.metadata.dist]
cargo-dist-version = "0.28.0"
ci = "github"
# The easy-install channels, all pointing at the same GitHub Release: a
# checksummed curl|sh script and a Homebrew formula pushed to our tap.
installers = ["shell", "homebrew"]
tap = "rushirb2001/homebrew-tap"
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    # ARM Linux: Graviton/Ampere servers, Raspberry Pi, and Linux on Apple Silicon.
    "aarch64-unknown-linux-gnu",
]
# Push the generated Homebrew formula to the tap on every release.
publish-jobs = ["homebrew"]
pr-run-mode = "plan"
# Install into the user's ~/.cargo/bin equivalent, adding it to PATH if needed.
install-path = "CARGO_HOME"

# cargo-dist's default runner pins (ubuntu-20.04, macos-13) are retired images, so
# the release jobs queue forever waiting for machines that no longer exist. Point
# every job at a currently-supported image (checked July 2026):
#   - global/housekeeping: ubuntu-latest
#   - Linux binary: ubuntu-22.04 (older glibc = broad Linux compatibility)
#   - macOS binaries: macos-15 (Sequoia, Apple Silicon). macos-13 is unsupported
#     and macos-14 entered deprecation on 2026-07-06; macos-15 cross-builds both
#     the aarch64 and x86_64 Darwin targets.
[workspace.metadata.dist.github-custom-runners]
global = "ubuntu-latest"
x86_64-unknown-linux-gnu = "ubuntu-22.04"
# GitHub's native ARM runner, so the ARM binary is built (not cross-compiled).
aarch64-unknown-linux-gnu = "ubuntu-22.04-arm"
aarch64-apple-darwin = "macos-15"
x86_64-apple-darwin = "macos-15"

# ── Build profiles ───────────────────────────────────────────────────────────
# Dev: keep line-table debuginfo (backtraces still resolve) but drop the full
# debuginfo that is the bulk of the target dir's growth across rebuilds.
[profile.dev]
debug = "line-tables-only"

# Release: smaller and faster. LTO + a single codegen unit help both size and
# runtime; `strip` removes symbols. We deliberately keep unwinding panics (the
# default `panic = "unwind"`) so the TUI's panic hook can restore the terminal.
[profile.release]
lto = true
codegen-units = 1
strip = true

# Dist: the profile cargo-dist builds release artifacts with. Inherit everything
# from `release` (LTO, single codegen unit, stripped) so distributed binaries
# match a local `--release` build.
[profile.dist]
inherits = "release"
