name: PyPI

# Publishes the `cohors` pip package after a GitHub Release is out: for each
# target it downloads that release's prebuilt binary, bundles it into a
# platform-specific wheel, and uploads all wheels to PyPI. Then it lists the new
# version in the official MCP Registry, which checks the PyPI package.
#
# It starts when the cargo-dist Release workflow finishes on a version tag.
# (Not on `release: published`: that release is created with the workflow's
# own token, and GitHub never starts other workflows from such events.)
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to package (e.g. v0.5.0)"
        required: true

permissions:
  contents: read

jobs:
  wheels:
    name: wheel (${{ matrix.target }})
    runs-on: ubuntu-latest
    # A run by hand, or a Release run that succeeded for a pushed version tag
    # (the Release workflow also runs a plan-only pass on pull requests).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            plat: macosx_11_0_arm64
          - target: x86_64-apple-darwin
            plat: macosx_10_12_x86_64
          # The Linux binaries are built on ubuntu-22.04 (glibc 2.35), so the
          # wheel must not claim to run on anything older than that.
          - target: x86_64-unknown-linux-gnu
            plat: manylinux_2_35_x86_64
          - target: aarch64-unknown-linux-gnu
            plat: manylinux_2_35_aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve release tag
        id: tag
        env:
          # For a tag push, the Release run's "branch" is the tag itself.
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: echo "tag=${INPUT_TAG:-$RUN_TAG}" >> "$GITHUB_OUTPUT"

      - name: Fetch the prebuilt binary from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "cohors-tui-$TARGET.tar.xz" --output bin.tar.xz
          mkdir -p extracted packaging/pypi/src/cohors
          tar -xf bin.tar.xz -C extracted
          bin=$(find extracted -type f -name cohors | head -n1)
          test -n "$bin" || { echo "cohors binary not found in tarball" >&2; exit 1; }
          cp "$bin" packaging/pypi/src/cohors/cohors
          chmod +x packaging/pypi/src/cohors/cohors

      - name: Stamp the version from the tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          v="${TAG#v}"
          sed -i "s/^version = .*/version = \"$v\"/" packaging/pypi/pyproject.toml

      - name: Build the platform wheel
        working-directory: packaging/pypi
        env:
          PLAT: ${{ matrix.plat }}
        run: |
          python -m pip install --upgrade build wheel
          python -m build --wheel
          # The wheel is built pure (py3-none-any) but carries a native binary;
          # retag it to this platform so pip installs the right one per machine.
          python -m wheel tags --platform-tag "$PLAT" --remove dist/*.whl
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: packaging/pypi/dist/*.whl

  publish:
    name: publish to PyPI
    needs: wheels
    runs-on: ubuntu-latest
    # Trusted Publishing (OIDC): configure a publisher on PyPI for this repo +
    # workflow + the `pypi` environment. No API token secret required.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Show what will be uploaded
        run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A rerun for a version already on PyPI uploads nothing, not an error.
          skip-existing: true

  mcp-registry:
    name: list in the MCP Registry
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write # GitHub's identity token proves we own io.github.rushirb2001
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.9
      RUN_TAG: ${{ github.event.workflow_run.head_branch }}
      INPUT_TAG: ${{ github.event.inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive=mcp-publisher_linux_amd64.tar.gz
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl -fsSL -o "$archive" "$base_url/$archive"
          curl -fsSL -o "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
      - name: Stamp the version from the tag
        run: |
          tag="${INPUT_TAG:-$RUN_TAG}"
          v="${tag#v}"
          jq --arg v "$v" '.version = $v | .packages[].version = $v' server.json > server.tmp
          mv server.tmp server.json
          cat server.json
      - name: Wait for PyPI to show the new version
        # The registry checks the package on PyPI, which can take a minute to
        # appear after the upload.
        run: |
          v="$(jq -r .version server.json)"
          for _ in $(seq 1 20); do
            curl -fs "https://pypi.org/pypi/cohors/$v/json" > /dev/null && exit 0
            sleep 15
          done
          echo "cohors $v never appeared on PyPI" >&2; exit 1
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
