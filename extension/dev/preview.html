<title>cohors extension preview</title>
<!--
  The dashboard webview in an ordinary browser, for review without launching
  VS Code. It loads the real media/main.css, media/view.js and media/main.js,
  defines the --vscode-* variables a theme would, stubs acquireVsCodeApi, and
  answers the webview's messages from dev/fixtures/ the way the extension
  host would. See dev/README.md.

  Query parameters (handy for screenshots):
    ?theme=dark|light|hc  &scenario=demo|empty|missing|badpath|error|noagent|norunner|untrusted|loading
    &page=overview|repos|tasks|standup|devices  &sel=<repo id>  &view=<saved view id>
-->

/* The harness bar. Not part of the extension. */
#harness { position: fixed; z-index: 100; top: 0; left: 0; right: 0; height: 34px; display: flex; align-items: center; gap: 10px; padding: 0 10px;
  font: 12px/1 -apple-system, "Segoe UI", system-ui, sans-serif; background: #111; color: #ddd; border-bottom: 1px solid #333; }
#harness b { font-weight: 600; }
#harness select, #harness button { height: 22px; font: inherit; color: #ddd; background: #262626; border: 1px solid #444; border-radius: 3px; padding: 0 6px; max-width: none; }
#harness #log { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #9a9a9a; font-family: ui-monospace, Menlo, monospace; }
body.bare #harness { display: none; }
#app { margin-top: 34px; height: calc(100vh - 34px) !important; }
body.bare #app { margin-top: 0; height: 100vh !important; }
.detail { top: 34px !important; }
body.bare .detail { top: 0 !important; }
</style>
</head>
<body class="t-dark vscode-dark">
<div id="harness">
  <b>cohors preview</b>
  <button id="theme" type="button">Theme: Dark Modern</button>
  <label>Scenario
    <select id="scenario">
      <option value="demo">Demo fleet</option>
      <option value="empty">No repositories</option>
      <option value="missing">cohors not installed</option>
      <option value="badpath">Wrong cohors.binaryPath</option>
      <option value="error">cohors failed</option>
      <option value="noagent">cohors without `agent`</option>
      <option value="norunner">No runner installed</option>
      <option value="untrusted">Untrusted workspace</option>
      <option value="loading">Still loading</option>
    </select>
  </label>
  <span id="log">Messages the webview sends to the host appear here.</span>
</div>
<div id="app"></div>

<script>
(function () {
  const params = new URLSearchParams(location.search);
  const THEMES = [
    { id: "dark", label: "Dark Modern", cls: ["t-dark", "vscode-dark"] },
    { id: "light", label: "Light Modern", cls: ["t-light", "vscode-light"] },
    { id: "hc", label: "Dark High Contrast", cls: ["t-hc", "vscode-high-contrast"] },
  ];
  let theme = Math.max(0, THEMES.findIndex((t) => t.id === params.get("theme")));
  function applyTheme() {
    document.body.className = THEMES[theme].cls.join(" ") + (params.has("bare") ? " bare" : "");
    document.getElementById("theme").textContent = "Theme: " + THEMES[theme].label;
  }
  applyTheme();
  document.getElementById("theme").addEventListener("click", () => { theme = (theme + 1) % THEMES.length; applyTheme(); });

  const scenarioSelect = document.getElementById("scenario");
  if (params.get("scenario")) scenarioSelect.value = params.get("scenario");

  // Fixtures, loaded once. The webview's first "ready" waits for them.
  const NAMES = ["host", "overview", "launchpad", "standup-week", "standup-today", "agent", "local", "devices"];
  const fixtures = {};
  const loaded = Promise.all(NAMES.map((n) =>
    fetch(`fixtures/${n}.json`).then((r) => r.json()).then((j) => { fixtures[n] = j; })));
  const clone = (v) => JSON.parse(JSON.stringify(v));

  // The message the extension host would send for each scenario.
  function stateFor(scenario) {
    const base = clone(fixtures.host);
    const full = () => Object.assign(base, {
      status: "ok", overview: clone(fixtures.overview), launchpad: clone(fixtures.launchpad),
      agent: clone(fixtures.agent), local: clone(fixtures.local),
    });
    switch (scenario) {
      case "loading": return null;
      case "missing":
        return Object.assign(base, { status: "missing", binary: undefined, problem: { message: "cohors was not found on your PATH.", configured: false } });
      case "badpath":
        return Object.assign(base, { status: "missing", binary: undefined, problem: { message: "The cohors.binaryPath setting points at ~/bin/cohors, which is not an executable file.", configured: true } });
      case "error":
        return Object.assign(base, { status: "error", problem: { kind: "failed", message: "could not read the config file", detail: "error: could not read the config file\n  /home/dev/.config/cohors/config.toml: invalid type: string, expected a sequence for key `roots`" } });
      case "empty": {
        const s = full();
        const f = s.overview.figures;
        for (const k of Object.keys(f)) f[k] = 0;
        Object.assign(s.overview, { headline: "No repositories.", repos: [], actions: [], work: [], commits: [], activity: [], focus: [] });
        Object.assign(s.launchpad, { repos: [], recent_activity: [], summary: { repos: 0, configured: 0, open_tasks: 0 } });
        s.launchpad.board.focus = [];
        s.local = { threads: {}, sessions: {} };
        return s;
      }
      case "noagent": {
        const s = full();
        s.agent = { runners: [], prompts: [], error: "This version of cohors has no `cohors agent` command, so agent setup is unavailable. Update cohors, then choose Detect again." };
        return s;
      }
      case "norunner": {
        const s = full();
        s.agent.runners.forEach((r) => { r.available = false; r.path = null; r.reason = `${r.bin} was not found on your PATH`; });
        return s;
      }
      case "untrusted": { const s = full(); s.trusted = false; return s; }
      default: return full();
    }
  }

  const log = (m) => {
    const { type, ...rest } = m;
    document.getElementById("log").textContent = `→ ${type} ${Object.keys(rest).length ? JSON.stringify(rest) : ""}`;
  };
  const toWebview = (m) => window.postMessage(m, "*");
  const pushData = () => {
    const state = stateFor(scenarioSelect.value);
    if (state) toWebview({ type: "data", state });
  };
  scenarioSelect.addEventListener("change", () => {
    if (scenarioSelect.value === "loading") return location.assign("?scenario=loading");
    pushData();
  });

  // What the extension host would do with each message, without the editor.
  function host(m) {
    log(m);
    switch (m.type) {
      case "ready": case "refresh": case "redetect":
        toWebview({ type: "busy", on: true });
        return void loaded.then(() => setTimeout(() => { pushData(); toWebview({ type: "busy", on: false }); }, m.type === "ready" ? 0 : 400));
      case "standup":
        return void loaded.then(() => setTimeout(() => toWebview({ type: "standup", window: m.window, data: clone(fixtures[`standup-${m.window}`]) }), 150));
      case "devices":
        return void loaded.then(() => setTimeout(() => toWebview({ type: "devices", data: clone(fixtures.devices) }), 150));
      case "copy": return void toWebview({ type: "toast", text: "Copied" });
      case "copyStandup": return void toWebview({ type: "toast", text: "Standup copied as markdown" });
      default: return;
    }
  }

  // The webview API stub. State can be seeded from the URL for screenshots.
  let stored = {};
  const seed = {};
  for (const k of ["page", "sel", "view", "q"]) if (params.get(k)) seed[k] = params.get(k);
  if (params.get("window")) seed.standupWindow = params.get("window");
  if (Object.keys(seed).length) stored = { ui: seed };
  window.acquireVsCodeApi = () => ({
    postMessage: host,
    getState: () => stored,
    setState: (s) => { stored = s; },
  });
})();
</script>
<script src="../media/view.js"></script>
<script src="../media/main.js"></script>
</body>
</html>
